{% load bl_icons %}
{% if object.status == object.STATES.DRAFT or object.comments or object.staff_comments %}
    {% if object.status == object.STATES.DRAFT %}
        <a href="#!" data-modal-url="{{ handler }}edit/">
            {% show_icon label='Edit' icon='edit' size='md' %}
        </a>
        <a href="#!" data-modal-url="{{ handler }}delete/">
            {% show_icon label='Delete' icon='delete' size='md' %}
        </a>
    {% endif %}
{% endif %}
