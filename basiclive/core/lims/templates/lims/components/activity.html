{% load bl_icons humanize %}
{% get_activity_icon activity as activity_icon %}
<div class="d-flex flex-row justify-content-between align-items-center w-100 small gap-2">
    {% show_icon icon=activity_icon size="sm" %}
    <div>{{ activity.description }}</div>
    <div class="ms-auto">{{ activity.created | naturaltime }}</div>
</div>
