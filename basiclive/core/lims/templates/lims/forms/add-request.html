{% extends "lims/modal/wizard.html" %}
{% load bl_layouts %}
{% load static %}

{% block modal_scripts %}
    {{ block.super }}
    <script>
        function updateRequest(e, copy) {
            let el = e.target;
            let value = el.value;
            if (!value) {
                return;
            }
            $.ajax({
                type: 'get',
                dataType: "json",
                url: $(el).data('post-action'),
                data: {'pk': value},
                beforeSend: function (xhr, settings) {
                    xhr.setRequestHeader("X-CSRFToken", $.cookie('csrftoken'));
                },
                success: function (data, status, xhr) {
                    let kind = $('[css-id="kind"]').parent().find('span[role="textbox"]');
                    let suffix = copy && ' - copy' || ''
                    let name = data['name'] + suffix;
                    $('[css-id="name"]').val(name);
                    $('[css-id="kind"]').find('option[value="' + data['kind_id'] + '"]').attr('selected', 'selected');
                    kind.text(data['kind_name']);
                    $('[css-id="comments"]').val(data['comments']);
                },
                error: function () {
                    $(el).shake();
                }
            });
        }
        $('[css-id="kind"]').on('change', function (e) {
            // Update the name field with the kind name if the name field is empty
            const kind = e.target;
            const name = $('[css-id="name"]');
            let prefix = name.val().split(' - ')[0] || '';
            name.val(prefix + ' - ' + kind.options[kind.selectedIndex].text);
        });
        $('[css-id="request-template"]').on('change', function (e) {
            updateRequest(e, true);
        });
        $('[css-id="request-existing"]').on('change', function (e) {
            updateRequest(e, false);
            $('[css-id="name"]').attr('readonly', true);
            $('[css-id="kind"]').attr('readonly', true);
            $('[css-id="comments"]').attr('readonly', true);
            $('[css-id="request-template"]').attr('readonly', true);
        });
    </script>
{% endblock %}
