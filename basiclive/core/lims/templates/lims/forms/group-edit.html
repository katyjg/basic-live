{% extends "crisp_modals/form.html" %}
{% load static %}

{% block modal_assets %}
    {{ block.super }}
    <script src="{% static "lims/js/basiclive-spreadsheet.min.js" %}"></script>
{% endblock %}

{% block modal_scripts %}
    {{ block.super }}
    <script>
    $('input[name$="name"]').on('change', function (e) {
        e.stopImmediatePropagation();
        $(this).val(slugify($(this).val()));
    });
    </script>
{% endblock %}
