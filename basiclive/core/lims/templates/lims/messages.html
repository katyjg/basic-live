{% load bl_tags static %}
<script src="{% static "lims/js/basiclive-notify.min.js" %}"></script>
<script type="text/javascript">
document.addEventListener('DOMContentLoaded', () => {
    const messages = {% prep_messages %};
    const notifier = new Notify({delay: 4000});
    messages.forEach(message => {
        notifier.show({
            message: message.text,
            color: message.tags,
        });
    });
});
</script>
