[project]
dynamic = ["version"]
name = "basiclive"
description = "A Framework for creating beamline LIMS"
license = "MIT"
authors = [
    {name = "Kathryn Janzen",email = "kathryn.janzen@lightsource.ca"},
    {name = "Michel Fodje",email = "michel.fodje@lightsource.ca"}
]
readme = "README.md"
requires-python = ">=3.13,<4.0"
dependencies = [
    "Django >= 6.1.1",
    "Markdown",
    "cryptography",
    "django-colorfield",
    "django-crispy-forms",
    "django-formtools",
    "django-itemlist >= 2026.1.15",
    "django-model-utils",
    "djangorestframework >= 3.18.2",
    "djangorestframework-simplejwt",
    "crispy-bootstrap5",
    "geopy",
    "habanero",
    "msgpack",
    "numpy",
    "httpx2[zstd]",
    "timezonefinder",
    "fastjsonschema",
    "psycopg2-binary>=2.9.12",
    "pymemcache>=4.0.0",
    "django-crisp-modals >= 2026.1.2",
    "django-reportcraft (>=2026.9.9,<2027.0.0)",
    "pandas (>=3.0.6,<4.0.0)",
]

[project.optional-dependencies]
ldap = [
    "django-python3-ldap",
    "ldap3",
]
cas = [
    "django-cas-ng",
]


[tool.poetry]
packages = [
    { include = "basiclive" },
]
version = "0.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0", "poetry-dynamic-versioning>=1.0.0,<2.0.0"]
build-backend = "poetry_dynamic_versioning.backend"

[tool.poetry.requires-plugins]
poetry-dynamic-versioning = { version = ">=1.0.0,<2.0.0", extras = ["plugin"] }

[tool.poetry-dynamic-versioning]
enable = true
vcs = "git"
format = "{base}.{revision}{distance}"
